<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accueil</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
        }
        .container {
            max-width: 600px;
            margin: auto;
        }
        button {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            font-size: 18px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            color: white;
        }
        .btn-evenements { background-color: #3498db; }
        .btn-admins { background-color: #2ecc71; }
        .btn-login { background-color: #e74c3c; }
        button:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Bienvenue sur notre plateforme</h1>
        <p>Utilisez les boutons ci-dessous pour naviguer.</p>
        <button class="btn-evenements" onclick="location.href='evenements.html'">Voir les événements</button>
        <button class="btn-admins" onclick="location.href='admins.html'">Voir l’équipe (admins)</button>
        <script>
            function checkAuth() {
                let loggedIn = localStorage.getItem("loggedIn");
                const authButton = document.getElementById("authButton");
        
                if (loggedIn === "true") {
                    authButton.textContent = "Se déconnecter";
                    authButton.onclick = logout;
                } else {
                    authButton.textContent = "Se connecter";
                    authButton.onclick = () => window.location.href = "login.html";
                }
            }
        
            function logout() {
                fetch("/api/logout", { method: "POST" })
                .then(() => {
                    localStorage.removeItem("loggedIn");
                    window.location.href = "index.html";
                })
                .catch(error => console.error("Erreur:", error));
            }
        
            document.addEventListener("DOMContentLoaded", checkAuth);
        </script>
        
        <button class="btn-login" id="authButton">Se connecter</button>
    </div>
</body>
</html>
