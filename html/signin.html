<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription</title>
    <link rel="stylesheet" href="../css/login-signin.css">
</head>
<body>
    <div class="background-img"></div>

    <div class="login-container">
        <div class="input-container">
            <h2>Inscription</h2>
            <input type="text" id="nom" placeholder="Nom" required>
            <input type="text" id="prenom" placeholder="Prénom" required>
            <input type="email" id="email" placeholder="Adresse email" required>
            <input type="password" id="password" placeholder="Mot de passe" required>
            <input type="code" id="code-admin" placeholder="Code admin">
            <button>Créer mon compte</button>
            <a href="login.html" class="link">Déjà un compte ? Connectez-vous</a>
            <p id="message"></p>   
        </div>

    </div>
    <script>
        function signup() {
            const nom = document.getElementById("nom").value;
            const prenom = document.getElementById("prenom").value;
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            fetch("/api/addutilisateur", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ nom, prenom, email, password })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    document.getElementById("message").textContent = "Compte créé avec succès ! Redirection...";
                    setTimeout(() => window.location.href = "lobby.html", 2000); // Redirection après 2s
                } else {
                    document.getElementById("message").textContent = "Erreur lors de l'inscription.";
                }
            })
            .catch(error => console.error("Erreur:", error));
        }
    </script>
</body>
</html>
